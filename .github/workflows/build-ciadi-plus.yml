name: Build CIADI+
on:
  workflow_dispatch:
  push:
    branches: ["ciadi-plus-build"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare CIADI+ source
        run: |
          set -euo pipefail
          rm -rf ciadi-plus
          unzip -q 'ciadi+ (1).zip' -d ciadi-plus
          echo "=== EXTRAÍDO ==="
          find ciadi-plus -maxdepth 3 -type f | head -100
          if [ ! -f ciadi-plus/settings.gradle.kts ]; then
            echo "settings.gradle.kts não encontrado na raiz; procurando o projeto Android..."
            SETTINGS=$(find ciadi-plus -name settings.gradle.kts -print -quit)
            if [ -z "$SETTINGS" ]; then
              echo "ERRO: projeto Android Gradle não encontrado no ZIP."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS")
            if [ "$PROJECT_DIR" != "ciadi-plus" ]; then
              mkdir -p ciadi-plus-source
              cp -a "$PROJECT_DIR"/. ciadi-plus-source/
              rm -rf ciadi-plus
              mv ciadi-plus-source ciadi-plus
            fi
          fi
          test -f ciadi-plus/settings.gradle.kts
          test -f ciadi-plus/app/build.gradle.kts

      - name: Audit Clínica Virtual source
        working-directory: ciadi-plus
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== FILES WITH CLINICA/VIRTUAL/CONSULTA ONLINE ==="
            grep -RniE 'Clínica Virtual|Clinica Virtual|Consulta Online|Teleconsulta|sala.html|agendamento' app/src/main --include='*.kt' --include='*.xml' || true
            echo "=== MANIFEST ==="
            sed -n '1,240p' app/src/main/AndroidManifest.xml || true
          } > ../clinic-source-audit.txt
          mkdir -p ../clinic-source-files
          cp app/src/main/java/com/example/ui/screens/virtualclinic/ClinicaVirtualScreen.kt ../clinic-source-files/ 2>/dev/null || true
          cp app/src/main/java/com/example/ui/screens/virtualclinic/SalaVideoScreen.kt ../clinic-source-files/ 2>/dev/null || true
          cp app/src/main/java/com/example/ui/screens/dashboard/MainDashboardScreen.kt ../clinic-source-files/ 2>/dev/null || true
          cp app/src/main/java/com/example/MainActivity.kt ../clinic-source-files/ 2>/dev/null || true\n          cp app/src/main/java/com/example/ui/navigation/AppNavigation.kt ../clinic-source-files/ 2>/dev/null || true\n          cp app/src/main/java/com/example/core/session/SessionManager.kt ../clinic-source-files/ 2>/dev/null || true\n          cp app/src/main/java/com/example/data/repository/SupabaseAuthRepositoryImpl.kt ../clinic-source-files/ 2>/dev/null || true\n          find app/src/main -type f -iname '*session*manager*.kt' -print -exec cp {} ../clinic-source-files/ \\; 2>/dev/null || true
          find app/src/main -type f -iname 'SupabaseAuthRepositoryImpl.kt' -print -exec cp {} ../clinic-source-files/ \\; 2>/dev/null || true
      - name: Upload Clínica Virtual source audit
        uses: actions/upload-artifact@v4
        with:
          name: clinic-source-audit
          path: clinic-source-audit.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload Clínica Virtual source files
        uses: actions/upload-artifact@v4
        with:
          name: clinic-source-files
          path: clinic-source-files
          if-no-files-found: warn
          retention-days: 3

      - name: Audit authentication source
        working-directory: ciadi-plus
        shell: bash
        run: |
          set -euo pipefail
          echo "=== AUTH FILES ==="
          find app/src/main -type f | grep -Ei '(supabase|auth|session|interceptor)' || true
          echo "=== AUTH REFERENCES ==="
          grep -RniE 'Bearer|Authorization|supabase|signInWith|signInWithPassword|access_token|publishable|anon' app/src/main --include='*.kt' --include='*.java' --include='*.xml' | head -250 || true

      - name: Normalize Android package
        working-directory: ciadi-plus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("app/build.gradle.kts")
          root = Path("build.gradle.kts")
          s = app.read_text()
          s = s.replace('namespace = "com.example"', 'namespace = "ao.ciadi.ciadi_plus"')
          s = s.replace('applicationId = "com.aistudio.ciadiplus.app"', 'applicationId = "ao.ciadi.ciadi_plus"')
          s = s.replace('import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy\n\n', '')
          s = s.replace('  alias(libs.plugins.google.services)\n', '')
          s = s.replace('  implementation(platform(libs.firebase.bom))\n', '')
          s = s.replace('  implementation(libs.firebase.ai)\n', '')
          s = s.replace('  implementation(libs.firebase.appcheck.recaptcha)\n', '')
          s = s.replace('  implementation(libs.firebase.appcheck.debug)\n', '')
          s = re.sub(r'googleServices \{[^\n]*\}\n?', '', s)
          app.write_text(s)
          if root.exists():
              root_s = root.read_text().replace('  alias(libs.plugins.google.services) apply false\n', '')
              root.write_text(root_s)
          for p in Path("app/src").rglob("*"):
              if p.is_file() and p.suffix in {".kt", ".xml"}:
                  try: t=p.read_text()
                  except UnicodeDecodeError: continue
                  if "com.example" in t:
                      p.write_text(t.replace("com.example", "ao.ciadi.ciadi_plus"))
          PY
          grep -q 'applicationId = "ao.ciadi.ciadi_plus"' app/build.gradle.kts
          grep -q 'namespace = "ao.ciadi.ciadi_plus"' app/build.gradle.kts

      - name: Validate no legacy CIADI+ auth patch is used
        run: |
          set -euo pipefail
          test ! -e scripts/fix_ciadi_plus_auth.py
          test ! -e ciadi+.zip
          test -e 'ciadi+ (1).zip'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Generate debug keystore
        working-directory: ciadi-plus
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Build debug APK
        working-directory: ciadi-plus
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ciadi-plus
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIADI-plus-debug-apk
          path: ciadi-plus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build delivery marker
        run: echo "CIADI+ APK build requested on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
