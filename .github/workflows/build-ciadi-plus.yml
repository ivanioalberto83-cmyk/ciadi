name: Build CIADI+
on:
  workflow_dispatch:
  push:
    branches: ["ciadi-plus-build"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare CIADI+ source
        run: |
          unzip -q ciadi-plus-source.zip -d ciadi-plus
          find ciadi-plus -maxdepth 3 -type f | head -50

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        working-directory: ciadi-plus
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIADI-plus-debug-apk
          path: ciadi-plus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
