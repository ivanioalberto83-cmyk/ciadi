name: Validate Apoio Escolar changes

on:
  push:
    branches:
      - fix/apoio-escolar-nova
  pull_request:
    branches:
      - nova-toddle-escolar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing smoke tests
        run: npm test
      - name: Electron entrypoint check
        run: npm run check
      - name: Parse Apoio Escolar JavaScript function
        shell: pwsh
        run: |
          $html = Get-Content index.html -Raw
          $start = $html.IndexOf('async function apoioEscolar(){')
          $end = $html.IndexOf('async function render(){', $start)
          if ($start -lt 0 -or $end -le $start) { throw "Função Apoio Escolar não encontrada ou sem limite final" }
          $code = $html.Substring($start, $end - $start)
          $path = Join-Path $env:TEMP "nova-apoio-escolar.js"
          Set-Content -Path $path -Value $code -Encoding utf8
          node --check $path
          if ($LASTEXITCODE -ne 0) { throw "Erro de sintaxe na função Apoio Escolar" }
