name: Deploy CIADI Plus Mobile Web
on:
  workflow_dispatch:
  push:
    branches:
      - ciadi-plus-build
    paths:
      - ciadi-plus-web/**
      - .github/workflows/deploy-ciadi-plus-web.yml
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ciadi-plus-web
      - uses: actions/deploy-pages@v4
