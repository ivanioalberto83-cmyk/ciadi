name: CIADI+ Android Build & Test

on:
  push:
    branches: ["main", "master", "ciadi-plus-build", "ciadi-plus-fixed-2026-09-30"]
  pull_request:
    branches: ["main", "master", "ciadi-plus-build", "ciadi-plus-fixed-2026-09-30"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test CIADI+ APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Extract and patch CIADI+ source
        run: bash ciadi-plus-ci-patch.sh
      - name: Prepare build secrets
        working-directory: ciadi-plus-src
        run: cp .env.example .env
      - name: Run unit tests
        working-directory: ciadi-plus-src
        run: gradle testDebugUnitTest --no-daemon
      - name: Build Debug APK
        working-directory: ciadi-plus-src
        run: gradle assembleDebug --no-daemon
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ciadi-plus-debug-apk-v13
          path: ciadi-plus-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
