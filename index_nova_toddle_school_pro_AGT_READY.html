};
window.__NOVA_BOOT_ERROR__ = function(message){
  window.__NOVA_BOOT_SCREEN("Não foi possível iniciar a interface.",message||"Erro desconhecido");
};
window.loadSupabaseClient = function(){
  return new Promise(function(resolve,reject){
    if(window.supabase && typeof window.supabase.createClient==="function"){resolve();return;}
    var sources=[
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js",
      "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ];
    var index=0;
    function next(){
      if(index>=sources.length){reject(new Error("Supabase JS não pôde ser carregado a partir dos CDNs configurados."));return;}
      var src=sources[index++];
      var s=document.createElement("script");
      var timer=setTimeout(function(){s.remove();next();},8000);
      s.onload=function(){clearTimeout(timer);if(window.supabase && typeof window.supabase.createClient==="function")resolve();else next();};
      s.onerror=function(){clearTimeout(timer);s.remove();next();};
      s.src=src;
      document.head.appendChild(s);
    }
    next();
  });
};
window.addEventListener("DOMContentLoaded",function(){
  window.__NOVA_BOOT_SCREEN("A iniciar a aplicação…","A preparar o módulo de autenticação.");
  window.loadSupabaseClient()
    .then(function(){window.dispatchEvent(new Event("nova:supabase-ready"));})
    .catch(function(err){window.__NOVA_BOOT_ERROR__(err.message);});
});
window.addEventListener("error",function(e){
  if(!window.supabase && document.getElementById("app")) window.__NOVA_BOOT_ERROR__(e.message||"Falha ao iniciar a interface.");
});
</script>

shell('<div class="card"><h1>💬 TODDLE CONNECT</h1><p class="muted">Comunicação segura entre escola, professores, alunos e encarregados.</p><div class="grid"><div class="card"><h3>💬 Conversas</h3><p class="muted">Mensagens privadas guardadas no Supabase.</p></div><div class="card"><h3>📢 Comunicados</h3><p class="muted">Informações oficiais da escola.</p></div><div class="card"><h3>👥 Turmas</h3><p class="muted">Comunicação por turma e grupos.</p></div><div class="card"><h3>🚨 SOS</h3><p class="muted">Acesso rápido ao sistema de denúncias.</p><button class="danger" id="sosgo">Abrir SOS</button></div></div><div class="card"><h2>Nova mensagem</h2><form id="chatf"><label>Destinatário (email ou nome)</label><input id="chatto" placeholder="email@escola.ao ou nome completo" required><label>Mensagem</label><textarea id="chatmsg" rows="5" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px" required></textarea><button class="primary">Enviar mensagem</button></form><div id="chatm"></div></div><div class="card"><h2>Mensagens recentes</h2><div id="chatlist">A carregar…</div></div></div>');
sosgo.onclick=()=>{view="sos";render()};
if(chatChannel){await db.removeChannel(chatChannel);chatChannel=null}
const {data:mine}=await db.from("mensagens").select("id,conversa_id,remetente_id,tipo,conteudo,created_at").order("created_at",{ascending:false}).limit(30);
const ids=[...(new Set((mine||[]).map(x=>x.remetente_id).filter(Boolean)))];
let names={};
if(ids.length){const {data:ps}=await db.from("perfis").select("id,nome_completo,email").in("id",ids);(ps||[]).forEach(p=>names[p.id]=p.nome_completo||p.email||p.id)}
function renderMessages(rows){
 chatlist.innerHTML=rows?.length?'<table class="table"><tr><th>Data</th><th>Remetente</th><th>Mensagem</th></tr>'+rows.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString())+'</td><td>'+esc(names[x.remetente_id]||x.remetente_id)+'</td><td>'+esc(x.conteudo||"")+'</td></tr>').join("")+'</table>':'<p class="muted">Ainda não existem mensagens.</p>';
}
renderMessages(mine);
chatChannel=db.channel("toddle-connect-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"mensagens"},async payload=>{
 const x=payload.new;
 const {data:p}=await db.from("perfis").select("id,nome_completo,email").eq("id",x.remetente_id).maybeSingle();
 if(p)names[p.id]=p.nome_completo||p.email||p.id;
 const {data:latest}=await db.from("mensagens").select("id,conversa_id,remetente_id,tipo,conteudo,created_at").order("created_at",{ascending:false}).limit(30);
 renderMessages(latest);
});
await chatChannel.subscribe();
chatf.onsubmit=async e=>{
 e.preventDefault();chatm.innerHTML='<div class="warn">A enviar mensagem…</div>';
 const {data,error}=await db.rpc("toddle_enviar_mensagem",{p_destinatario:chatto.value.trim(),p_conteudo:chatmsg.value.trim(),p_titulo:"TODDLE CONNECT"});
 if(error){chatm.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}
 chatm.innerHTML='<div class="ok"><b>Mensagem enviada e gravada.</b> O destinatário receberá a notificação.</div>';
 chatmsg.value="";
 const {data:latest}=await db.from("mensagens").select("id,conversa_id,remetente_id,tipo,conteudo,created_at").order("created_at",{ascending:false}).limit(30);
 renderMessages(latest);
};
}

á receber os dados necessários para tratar o caso; não incluiremos o nome do denunciante no registo público do caso.</p><button class="danger">Enviar denúncia segura</button></form><div id="sosm"></div></div><div class="card" style="margin-top:16px"><h2>Meus pedidos SOS</h2><div id="soslist">A carregar…</div></div>');

sosf.onsubmit=async e=>{e.preventDefault();sosm.innerHTML='<div class="warn">A enviar denúncia…</div>';const anonymous=sosan.checked;const payload={instituicao_id:me.instituicao_id,denunciante_id:anonymous?null:me.id,aluno_id:sosa.value||null,categoria:sosc.value,gravidade:sosg.value,anonima:anonymous,titulo:sost.value.trim(),descricao:sosd.value.trim(),local_ocorrencia:sosl.value.trim()||null,data_ocorrencia:sosdate.value?new Date(sosdate.value).toISOString():null};const{error}=await db.from("sos_denuncias").insert(payload);if(error){sosm.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}sosm.innerHTML='<div class="ok"><b>Denúncia enviada com sucesso.</b><br>A escola recebeu o caso para triagem. Guarde esta área para acompanhar o estado.</div>';sosf.reset();await sos()};}

async function moduleView(key){

  fmList.innerHTML=r.met.length?'<table class="table"><tr><th>Código</th><th>Nome</th><th>Tipo</th><th>Estado</th>'+(canMethod?'<th>Ação</th>':'')+'</tr>'+r.met.map(x=>'<tr><td>'+esc(x.codigo)+'</td><td>'+esc(x.nome)+'</td><td>'+esc(x.tipo)+'</td><td>'+esc(x.ativo?'Activo':'Inactivo')+'</td>'+(canMethod?'<td><button class="secondary" data-fmt="'+esc(x.id)+'">'+(x.ativo?'Desactivar':'Activar')+'</button></td>':'')+'</tr>').join("")+'</table>':'<p class="muted">Sem métodos de pagamento configurados.</p>';
  document.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=async()=>{const id=b.dataset.fmt,x=r.met.find(y=>y.id===id);if(!x)return;const {error}=await db.from("metodos_pagamento").update({ativo:!x.ativo}).eq("id",id).eq("instituicao_id",me.instituicao_id);if(error){fmMsg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}const {data:v}=await db.from("metodos_pagamento").select("id,ativo").eq("id",id).maybeSingle();fmMsg.innerHTML=v?'<div class="ok">Método actualizado e verificado no Supabase.</div>':'<div class="error">Não foi possível verificar a alteração.</div>';await draw()});
  }
  fcList.innerHTML=charges.length?'<div style="overflow:auto"><table class="table"><tr><th>Vencimento</th><th>Aluno</th><th>Descrição</th><th>Valor</th><th>Pago</th><th>Saldo</th><th>Estado</th><th>Fiscal</th><th>Ação</th></tr>'+charges.map(x=>'<tr><td>'+esc(x.vencimento||"")+'</td><td>'+esc(x.alunos?.nome_completo||x.aluno_id)+'</td><td>'+esc(x.descricao)+'</td><td>'+Number(x.valor||0).toFixed(2)+'</td><td>'+Number(x.valor_pago||0).toFixed(2)+'</td><td>'+Number(x.saldo||0).toFixed(2)+'</td><td>'+esc(x.estado)+'</td><td>'+esc(x.documento_fiscal_id?"Vinculado":"—")+'</td><td><button class="secondary" data-fstate="'+esc(x.id)+'">Actualizar estado</button></td></tr>').join("")+'</table></div>':'<p class="muted">Sem cobranças registadas.</p>';
  document.querySelectorAll("[data-fstate]").forEach(b=>b.onclick=async()=>{const {data,error}=await db.rpc("nova_atualizar_estado_cobranca",{p_cobranca_id:b.dataset.fstate});if(error){fcMsg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}const {data:v}=await db.from("cobrancas_escolares").select("id,estado").eq("id",b.dataset.fstate).maybeSingle();fcMsg.innerHTML=v&&v.estado===data?'<div class="ok">Estado actualizado para <b>'+esc(data)+'</b> e verificado no Supabase.</div>':'<div class="error">Estado alterado mas a verificação falhou.</div>';await draw()});
  fpList.innerHTML=pays.length?'<div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Aluno</th><th>Cobrança</th><th>Valor</th><th>Método</th><th>Referência</th></tr>'+pays.map(x=>'<tr><td>'+esc(x.data_pagamento||"")+'</td><td>'+esc(alunoName[x.aluno_id]||x.aluno_id||"")+'</td><td>'+esc(x.cobranca_id||"")+'</td><td>'+Number(x.valor||0).toFixed(2)+'</td><td>'+esc(x.metodo||"")+'</td><td>'+esc(x.referencia||"")+'</td></tr>').join("")+'</table></div>':'<p class="muted">Sem pagamentos registados.</p>';
 }
 await draw();
}
async function academicYears(){
 if(!school()){shell('<div class="warn">Associe este perfil a uma escola.</div>');return}
 shell('<div class="hero"><h1>📅 Anos Letivos</h1><p>Base necessária para a criação de turmas.</p></div><div class="card" style="margin-top:16px"><form id="yearForm" class="grid" style="grid-template-columns:repeat(3,1fr)"><div><label>Nome</label><input id="yn" required placeholder="2026/2027"></div><div><label>Data início</label><input id="yd1" type="date" required></div><div><label>Data fim</label><input id="yd2" type="date" required></div><div style="grid-column:1/-1"><button class="primary" style="max-width:240px">Criar ano letivo</button></div></form><div id="yearMsg"></div></div><div class="card" style="margin-top:16px"><div id="yearList">A carregar…</div></div>');
 const {data,error}=await db.from("anos_letivos").select("*").eq("instituicao_id",me.instituicao_id).order("data_inicio",{ascending:false});
 yearList.innerHTML=error?'<div class="error">'+esc(error.message)+'</div>':(data?.length?'<table class="table"><tr><th>Nome</th><th>Início</th><th>Fim</th><th>Atual</th></tr>'+data.map(r=>'<tr><td>'+esc(r.nome)+'</td><td>'+esc(r.data_inicio)+'</td><td>'+esc(r.data_fim)+'</td><td>'+esc(r.atual?'Sim':'Não')+'</td></tr>').join("")+'</table>':'<p class="muted">Sem anos letivos.</p>');
 yearForm.onsubmit=async e=>{e.preventDefault();const payload={instituicao_id:me.instituicao_id,nome:yn.value.trim(),data_inicio:yd1.value,data_fim:yd2.value,atual:false};const {data,error}=await db.from("anos_letivos").insert(payload).select("id").single();if(error){yearMsg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}const {data:v}=await db.from("anos_letivos").select("id").eq("id",data.id).maybeSingle();yearMsg.innerHTML=v?'<div class="ok">Ano letivo criado e verificado no Supabase.</div>':'<div class="error">Criado mas não foi possível verificar.</div>';await academicYears()};
}

async function render(){if(!me)return login();
if(view==="inicio"){
 if(admin()){
  const [schoolsCount,activeSubs,openSupport,openMaint]=await Promise.all([

  shell('<div class="hero"><h1>Bom dia, '+esc(name())+'!</h1><p>Painel central de gestão comercial da NOVA TODDLE.</p></div><div class="grid"><div class="card stat"><strong>'+schoolsCount+'</strong><span>Escolas clientes</span></div><div class="card stat"><strong>'+(activeSubs.count||0)+'</strong><span>Assinaturas ativas/trial</span></div><div class="card stat"><strong>'+(openSupport.count||0)+'</strong><span>Chamados de suporte</span></div><div class="card stat"><strong>'+(openMaint.count||0)+'</strong><span>Manutenções abertas</span></div></div><div class="grid"><div class="card"><h3>🏢 Operação SaaS</h3><p class="muted">Cadastro de escolas, planos, licenças e limites por tenant.</p></div><div class="card"><h3>🛠 Continuidade</h3><p class="muted">Suporte, manutenção, versões e atualizações centralizadas.</p></div><div class="card"><h3>🔐 Segurança</h3><p class="muted">Isolamento entre escolas através de RLS e autorização no banco.</p></div><div class="card"><h3>🤖 NOVA AI</h3><p class="muted">Assistente contextualizado pelo perfil e instituição.</p></div></div><div class="card"><h2>Próxima operação</h2><p>Use <b>Nova Escola</b> para cadastrar o primeiro cliente. O sistema gera o código técnico/comercial da escola e envia o convite ao administrador.</p></div>');return;
 }
 const [c1,c2,c3,c4]=await Promise.all(["alunos","professores","turmas","matriculas"].map(count));
 const {data:inst}=await db.from("instituicao").select("codigo_escola,nome,status,plano,data_expiracao,logo_url,limite_alunos,limite_professores").eq("id",me.instituicao_id).maybeSingle();
 const {data:sub}=await db.from("plataforma_assinaturas").select("estado,inicio,fim,limite_alunos,limite_professores,plano_id").eq("instituicao_id",me.instituicao_id).in("estado",["trial","active","past_due","suspended","expired"]).order("created_at",{ascending:false}).limit(1).maybeSingle();
 shell('<div class="hero"><h1>Bom dia, '+esc(name())+'!</h1><p>Painel operacional da escola.</p></div><div class="grid"><div class="card stat"><strong>'+c1+'</strong><span>Alunos</span></div><div class="card stat"><strong>'+c2+'</strong><span>Professores</span></div><div class="card stat"><strong>'+c3+'</strong><span>Turmas</span></div><div class="card stat"><strong>'+c4+'</strong><span>Matrículas</span></div></div><div class="grid"><div class="card"><h3>🏫 Escola</h3><p><b>'+esc(inst?.nome||"—")+'</b></p><p class="muted">Código: '+esc(inst?.codigo_escola||"—")+'</p><span class="pill">'+esc(inst?.status||"—")+'</span></div><div class="card"><h3>💳 Plano</h3><p><b>'+esc(inst?.plano||"—")+'</b></p><p class="muted">Expiração: '+esc(inst?.data_expiracao||"Sem data")+'</p><span class="pill">'+esc(sub?.estado||"sem assinatura")+'</span></div><div class="card"><h3>👨‍🎓 Limite de alunos</h3><p><b>'+esc(inst?.limite_alunos??"Não definido")+'</b></p><p class="muted">Utilizados: '+c1+'</p></div><div class="card"><h3>👩‍🏫 Limite de professores</h3><p><b>'+esc(inst?.limite_professores??"Não definido")+'</b></p><p class="muted">Utilizados: '+c2+'</p></div></div><div class="card"><h2>Ambiente da escola</h2><p class="muted">Os dados deste tenant são separados dos demais clientes através das políticas RLS da plataforma.</p></div>');return;}
if(MODULES[view]){await moduleView(view);return}
if(view==="comunicacao"){await chat();return}
if(view==="sos"){if(!school()){shell('<div class="warn">Associe este perfil a uma escola para utilizar o SOS escolar.</div>');return}await sos();return}
if(view==="nova-escola"&&admin()){await createSchool();return}
if(view==="escolas"&&admin()){await schools();return}
if(view==="planos"&&admin()){await list("Planos Comerciais","plataforma_planos");return}

if(view==="assinaturas"&&admin()){await assinaturas();return}
if(view==="instituicao"){shell('<div class="card"><h1>Instituição</h1><p class="muted">'+(school()?"Tenant associado ao perfil.":"Super Admin: pode gerir múltiplas instituições.")+'</p><div class="'+(school()?"ok":"warn")+'">'+(school()?"Instituição configurada.":"Nenhuma instituição associada a este perfil.")+'</div></div>');return}
if(view==="nova"){shell('<div class="hero"><h1>NOVA AI</h1><p>Assistente escolar por tenant, com identidade do utilizador e autenticação JWT.</p></div><div class="card"><p>Utilizador: <b>'+esc(me.nome_completo)+'</b></p><p class="muted">A IA deve respeitar a instituição do perfil e nunca misturar dados entre escolas.</p></div>');return}
if(view==="alunos"){await coreCrud("alunos");return}if(view==="professores"){await coreCrud("professores");return}if(view==="academico"){await coreCrud("turmas");return}if(view==="anos-letivos"){await academicYears();return}if(view==="matriculas"){await matriculas();return}if(view==="presencas"){await presencas();return}if(view==="avaliacoes"){await avaliacoes();return}if(view==="progresso"){await progresso();return}if(view==="financeiro"){await financeiro();return}const map={comunicacao:["Comunicação","comunicados"],encarregados:["Encarregados de Educação","encarregados"],admissoes:["Admissões","candidatos_admissao"],documentos:["Documentos","documentos_escolares"]};const z=map[view];if(z)return list(z[0],z[1]);}
db.auth.onAuthStateChange(e=>{if(e==="SIGNED_OUT"){me=null;login()}});(async()=>{const{data:{session}}=await db.auth.getSession();session?load():login()})();
}
