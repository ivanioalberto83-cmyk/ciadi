<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA TODDLE ESCOLAR — SaaS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#2563eb;--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);display:grid;place-items:center;color:#fff;font-weight:800}.brand small{display:block;color:var(--muted)}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 68px)}.side{background:#0f172a;color:#cbd5e1;padding:18px 12px}.side button{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;margin:2px 0}.side button.active,.side button:hover{background:#1e293b;color:#fff}
.main{padding:28px;max-width:1450px;width:100%;margin:auto}.hero{background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:#fff;border-radius:20px;padding:28px}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 20px #0f172a08}.stat strong{font-size:30px;display:block}.stat span,.muted{color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:700}.ok{background:#dcfce7;color:#166534;padding:10px;border-radius:9px}.warn{background:#fef3c7;color:#92400e;padding:10px;border-radius:9px}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:9px}.secondary{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:9px;cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#eff6ff}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px}label{font-size:13px;font-weight:700;display:block;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.primary{width:100%;margin-top:18px;background:var(--p);color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;cursor:pointer}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.main{padding:16px}}
</style>
</head>
<body><div id="app"></div>
<script>
const URL="https://rojyxfjaidyvtmsmefcf.supabase.co",KEY="sb_publishable_NMAq5b6mRp-eD3mkbWGGgQ_PtDIzqY-";
const db=supabase.createClient(URL,KEY),app=document.getElementById("app");let me=null,view="inicio";
const LANGS=[["de","Deutsch"],["ar","العربية"],["zh","中文"],["es","Español"],["fr","Français"],["en","English"],["it","Italiano"],["ja","日本語"],["nl","Nederlands"],["pt","Português"],["pt-BR","Português do Brasil"],["ru","Русский"]];
let lang=localStorage.getItem("nova_toddle_lang")||"pt";
const TR={"pt":{"Entrar":"Entrar","Sair":"Sair","Email":"Email","Palavra-passe":"Palavra-passe","Início":"Início","Alunos":"Alunos","Professores":"Professores","Académico":"Académico","Comunicação":"Comunicação","Encarregados":"Encarregados","Admissões":"Admissões","Financeiro":"Financeiro","Documentos":"Documentos","Instituição":"Instituição","Escolas Clientes":"Escolas Clientes","Nova Escola":"Nova Escola","Planos":"Planos","Manutenção":"Manutenção","Suporte":"Suporte","Assinaturas":"Assinaturas","NOVA AI":"NOVA AI","Plataforma SaaS para várias escolas.":"Plataforma SaaS para várias escolas."},"en":{"Entrar":"Sign in","Sair":"Sign out","Email":"Email","Palavra-passe":"Password","Início":"Home","Alunos":"Students","Professores":"Teachers","Académico":"Academic","Comunicação":"Communication","Encarregados":"Guardians","Admissões":"Admissions","Financeiro":"Finance","Documentos":"Documents","Instituição":"Institution","Escolas Clientes":"Client Schools","Nova Escola":"New School","Planos":"Plans","Manutenção":"Maintenance","Suporte":"Support","Assinaturas":"Subscriptions","NOVA AI":"NOVA AI","Plataforma SaaS para várias escolas.":"SaaS platform for multiple schools."},"es":{"Entrar":"Iniciar sesión","Sair":"Salir","Email":"Correo electrónico","Palavra-passe":"Contraseña","Início":"Inicio","Alunos":"Alumnos","Professores":"Profesores","Académico":"Académico","Comunicação":"Comunicación","Encarregados":"Tutores","Admissões":"Admisiones","Financeiro":"Finanzas","Documentos":"Documentos","Instituição":"Institución","Escolas Clientes":"Escuelas cliente","Nova Escola":"Nueva escuela","Planos":"Planes","Manutenção":"Mantenimiento","Suporte":"Soporte","Assinaturas":"Suscripciones","NOVA AI":"NOVA AI","Plataforma SaaS para várias escolas.":"Plataforma SaaS para varias escuelas."},"fr":{"Entrar":"Se connecter","Sair":"Se déconnecter","Email":"E-mail","Palavra-passe":"Mot de passe","Início":"Accueil","Alunos":"Élèves","Professores":"Enseignants","Académico":"Académique","Comunicação":"Communication","Encarregados":"Responsables","Admissões":"Admissions","Financeiro":"Finance","Documentos":"Documents","Instituição":"Établissement","Escolas Clientes":"Écoles clientes","Nova Escola":"Nouvelle école","Planos":"Plans","Manutenção":"Maintenance","Suporte":"Support","Assinaturas":"Abonnements","NOVA AI":"NOVA AI","Plataforma SaaS para várias escolas.":"Plateforme SaaS pour plusieurs écoles."}};
function t(s){return TR[lang]?.[s]||TR.pt[s]||s}
function languageSelector(){return '<select id="lang" aria-label="Idioma">'+LANGS.map(([code,label])=>'<option value="'+code+'" '+(code===lang?'selected':'')+'>'+label+'</option>').join("")+'</select>'}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const admin=()=>me?.role==="super_admin", school=()=>!!me?.instituicao_id, name=()=>((me?.nome_completo||"Utilizador").trim().split(/\s+/)[0]);
function login(msg=""){app.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">NT</div><h1>NOVA TODDLE ESCOLAR</h1><p>${t("Plataforma SaaS para várias escolas.")}</p><form id="f"><label>${t("Email")}</label><input id="e" type="email" required><label>${t("Palavra-passe")}</label><input id="p" type="password" required><button class="primary">${t("Entrar")}</button></form><div id="m">${msg?'<div class="error">'+esc(msg)+'</div>':""}</div></div></div>`;f.onsubmit=async x=>{x.preventDefault();m.textContent="A autenticar…";const{error}=await db.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(error)m.innerHTML='<div class="error">'+esc(error.message)+'</div>';else await load()}}
async function load(){const{data:{user}}=await db.auth.getUser();if(!user)return login();const{data,error}=await db.from("perfis").select("id,instituicao_id,nome_completo,email,role,ativo").eq("id",user.id).maybeSingle();if(error||!data)return login("Perfil não encontrado.");if(!data.ativo){await db.auth.signOut();return login("Perfil inativo.");}me=data;render()}
async function out(){await db.auth.signOut();me=null;login()}
async function count(t){const{count,error}=await db.from(t).select("*",{count:"exact",head:true});return error?0:count||0}
function shell(body){app.innerHTML=`<header class="top"><div class="brand"><div class="logo">NT</div><div><b>NOVA TODDLE ESCOLAR</b><small>${admin()?"Super Admin da Plataforma":esc(me.role)}</small></div></div><div style="display:flex;gap:10px;align-items:center"><span style="font-size:12px">🌐</span>${languageSelector()}<button class="secondary" id="out">${t("Sair")}</button></div></header><div class="layout"><aside class="side"><button data-v="inicio">⌂ ${t("Início")}</button><button data-v="alunos">👨‍🎓 ${t("Alunos")}</button><button data-v="professores">👩‍🏫 ${t("Professores")}</button><button data-v="academico">📚 ${t("Académico")}</button><button data-v="comunicacao">💬 ${t("Comunicação")}</button><button data-v="encarregados">👨‍👩‍👧 ${t("Encarregados")}</button><button data-v="admissoes">📝 ${t("Admissões")}</button><button data-v="financeiro">💰 ${t("Financeiro")}</button><button data-v="documentos">📄 ${t("Documentos")}</button><button data-v="instituicao">🏫 ${t("Instituição")}</button><button data-v="nova">✦ ${t("NOVA AI")}</button>${admin()?'<hr><button data-v="escolas">🏢 ${t("Escolas Clientes")}</button><button data-v="nova-escola">➕ ${t("Nova Escola")}</button><button data-v="planos">▣ ${t("Planos")}</button><button data-v="manutencao">🛠 ${t("Manutenção")}</button><button data-v="suporte">🎫 ${t("Suporte")}</button><button data-v="assinaturas">💳 ${t("Assinaturas")}</button>':""}</aside><main class="main">${body}</main></div>`;out.onclick=out;const langEl=document.getElementById("lang");if(langEl)langEl.onchange=()=>{lang=langEl.value;localStorage.setItem("nova_toddle_lang",lang);render()};document.querySelectorAll("[data-v]").forEach(b=>{if(b.dataset.v===view)b.classList.add("active");b.onclick=()=>{view=b.dataset.v;render()}})}
async function createSchool(){shell('<div class="card"><h1>Nova escola cliente</h1><p class="muted">Crie o tenant e envie o convite ao administrador.</p><form id="sf"><label>Nome da escola</label><input id="sn" required><label>Nome curto</label><input id="sc"><label>Slug</label><input id="ss" required><label>Cidade</label><input id="city" value="Luanda"><label>Email do administrador</label><input id="se" type="email" required><label>Logotipo da escola</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><small class="muted">PNG, JPG, WEBP ou SVG · máximo 2 MB</small><label>Nome do administrador</label><input id="sa"><label>Plano</label><input id="sp" value="standard"><button class="primary">Criar escola e enviar convite</button></form><div id="sm"></div></div>');sf.onsubmit=async e=>{e.preventDefault();sm.innerHTML='<div class="warn">A criar escola…</div>';const{data,error}=await db.functions.invoke("platform-onboarding",{body:{nome:sn.value,nome_curto:sc.value,slug:ss.value,cidade:city.value,email:se.value,admin_nome:sa.value,plano:sp.value}});if(error||data?.error){sm.innerHTML='<div class="error">'+esc(error?.message||data?.error||"Falha no onboarding.")+'</div>';return}
if(logo.files?.[0]){
 const file=logo.files[0];
 if(file.size>2097152){sm.innerHTML='<div class="error">O logotipo ultrapassa 2 MB.</div>';return}
 const ext=(file.name.split(".").pop()||"png").toLowerCase();
 const path=data.instituicao.id+"/logo."+ext;
 const up=await db.storage.from("school-logos").upload(path,file,{contentType:file.type,upsert:true,cacheControl:"3600"});
 if(up.error){sm.innerHTML='<div class="error">Escola criada, mas o logotipo não foi enviado: '+esc(up.error.message)+'</div>';return}
 const{data:pub}=db.storage.from("school-logos").getPublicUrl(path);
 const{error:updateError}=await db.from("instituicao").update({logo_url:pub.publicUrl}).eq("id",data.instituicao.id);
 if(updateError){sm.innerHTML='<div class="error">Escola criada, mas não foi possível guardar o logotipo.</div>';return}
}
sm.innerHTML='<div class="ok"><b>Escola criada com sucesso.</b><br>Código da escola: <b>'+esc(data.instituicao.codigo_escola||"")+'</b><br>ID técnico: <code>'+esc(data.instituicao.id||"")+'</code><br>Administrador: '+esc(data.administrador.email||"")+'</div>';sf.reset();};}
async function schools(){shell('<div class="card"><h1>Escolas Clientes</h1><p class="muted">Tenants comerciais da NOVA TODDLE, com identificação, licença e estado.</p><div id="x">A carregar…</div></div>');const{data,error}=await db.from("instituicao").select("id,codigo_escola,nome,nome_curto,slug,cidade,status,plano,limite_alunos,limite_professores,logo_url,data_inicio,data_expiracao,created_at").order("created_at",{ascending:false});if(error){x.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}if(!data?.length){x.innerHTML='<div class="warn">Ainda não existem escolas clientes. Use “Nova Escola” para criar a primeira.</div>';return}x.innerHTML='<table class="table"><tr><th>Logo</th><th>Código</th><th>Escola</th><th>Cidade</th><th>Estado</th><th>Plano</th><th>Expiração</th></tr>'+data.map(r=>'<tr><td>'+(r.logo_url?'<img src="'+esc(r.logo_url)+'" style="width:42px;height:42px;object-fit:contain;border-radius:8px;border:1px solid var(--line)">':'—')+'</td><td><b>'+esc(r.codigo_escola)+'</b></td><td>'+esc(r.nome)+'<br><span class="muted">'+esc(r.slug||"")+'</span></td><td>'+esc(r.cidade||"—")+'</td><td><span class="pill">'+esc(r.status)+'</span></td><td>'+esc(r.plano||"—")+'</td><td>'+esc(r.data_expiracao||"Sem data")+'</td></tr>').join("")+'</table>'}
async function list(title,table){shell('<div class="card"><h1>'+title+'</h1><p class="muted">Dados reais do tenant, protegidos por RLS.</p><div id="x">A carregar…</div></div>');if(!school()&&!admin()){x.innerHTML='<div class="warn">Este utilizador ainda não está associado a uma escola.</div>';return}const{data,error}=await db.from(table).select("*").limit(50);if(error){x.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}if(!data?.length){x.innerHTML='<p class="muted">Sem registos.</p>';return}const c=Object.keys(data[0]).slice(0,5);x.innerHTML='<table class="table"><tr>'+c.map(k=>'<th>'+esc(k)+'</th>').join("")+'</tr>'+data.map(r=>'<tr>'+c.map(k=>'<td>'+esc(r[k])+'</td>').join("")+'</tr>').join("")+'</table>'}
async function render(){if(!me)return login();
if(view==="inicio"){
 if(admin()){
  const [schoolsCount,activeSubs,openSupport,openMaint]=await Promise.all([
   count("instituicao"),
   db.from("plataforma_assinaturas").select("*",{count:"exact",head:true}).in("estado",["trial","active"]),
   db.from("plataforma_suporte").select("*",{count:"exact",head:true}).in("estado",["aberto","em_analise","aguarda_cliente"]),
   db.from("plataforma_manutencoes").select("*",{count:"exact",head:true}).in("status",["aberta","em_execucao"])
  ]);
  shell('<div class="hero"><h1>Bom dia, '+esc(name())+'!</h1><p>Painel central de gestão comercial da NOVA TODDLE.</p></div><div class="grid"><div class="card stat"><strong>'+schoolsCount+'</strong><span>Escolas clientes</span></div><div class="card stat"><strong>'+(activeSubs.count||0)+'</strong><span>Assinaturas ativas/trial</span></div><div class="card stat"><strong>'+(openSupport.count||0)+'</strong><span>Chamados de suporte</span></div><div class="card stat"><strong>'+(openMaint.count||0)+'</strong><span>Manutenções abertas</span></div></div><div class="grid"><div class="card"><h3>🏢 Operação SaaS</h3><p class="muted">Cadastro de escolas, planos, licenças e limites por tenant.</p></div><div class="card"><h3>🛠 Continuidade</h3><p class="muted">Suporte, manutenção, versões e atualizações centralizadas.</p></div><div class="card"><h3>🔐 Segurança</h3><p class="muted">Isolamento entre escolas através de RLS e autorização no banco.</p></div><div class="card"><h3>🤖 NOVA AI</h3><p class="muted">Assistente contextualizado pelo perfil e instituição.</p></div></div><div class="card"><h2>Próxima operação</h2><p>Use <b>Nova Escola</b> para cadastrar o primeiro cliente. O sistema gera o código técnico/comercial da escola e envia o convite ao administrador.</p></div>');return;
 }
 const [c1,c2,c3,c4]=await Promise.all(["alunos","professores","turmas","matriculas"].map(count));
 const {data:inst}=await db.from("instituicao").select("codigo_escola,nome,status,plano,data_expiracao,logo_url,limite_alunos,limite_professores").eq("id",me.instituicao_id).maybeSingle();
 const {data:sub}=await db.from("plataforma_assinaturas").select("estado,inicio,fim,limite_alunos,limite_professores,plano_id").eq("instituicao_id",me.instituicao_id).in("estado",["trial","active","past_due","suspended","expired"]).order("created_at",{ascending:false}).limit(1).maybeSingle();
 shell('<div class="hero"><h1>Bom dia, '+esc(name())+'!</h1><p>Painel operacional da escola.</p></div><div class="grid"><div class="card stat"><strong>'+c1+'</strong><span>Alunos</span></div><div class="card stat"><strong>'+c2+'</strong><span>Professores</span></div><div class="card stat"><strong>'+c3+'</strong><span>Turmas</span></div><div class="card stat"><strong>'+c4+'</strong><span>Matrículas</span></div></div><div class="grid"><div class="card"><h3>🏫 Escola</h3><p><b>'+esc(inst?.nome||"—")+'</b></p><p class="muted">Código: '+esc(inst?.codigo_escola||"—")+'</p><span class="pill">'+esc(inst?.status||"—")+'</span></div><div class="card"><h3>💳 Plano</h3><p><b>'+esc(inst?.plano||"—")+'</b></p><p class="muted">Expiração: '+esc(inst?.data_expiracao||"Sem data")+'</p><span class="pill">'+esc(sub?.estado||"sem assinatura")+'</span></div><div class="card"><h3>👨‍🎓 Limite de alunos</h3><p><b>'+esc(inst?.limite_alunos??"Não definido")+'</b></p><p class="muted">Utilizados: '+c1+'</p></div><div class="card"><h3>👩‍🏫 Limite de professores</h3><p><b>'+esc(inst?.limite_professores??"Não definido")+'</b></p><p class="muted">Utilizados: '+c2+'</p></div></div><div class="card"><h2>Ambiente da escola</h2><p class="muted">Os dados deste tenant são separados dos demais clientes através das políticas RLS da plataforma.</p></div>');return;}
if(view==="nova-escola"&&admin()){await createSchool();return}
if(view==="escolas"&&admin()){await schools();return}
if(view==="planos"&&admin()){await list("Planos Comerciais","plataforma_planos");return}
if(view==="manutencao"&&admin()){await list("Manutenção e Suporte","plataforma_manutencoes");return}
if(view==="suporte"){await list("Suporte","plataforma_suporte");return}
if(view==="assinaturas"&&admin()){await list("Assinaturas das Escolas","plataforma_assinaturas");return}
if(view==="instituicao"){shell('<div class="card"><h1>Instituição</h1><p class="muted">'+(school()?"Tenant associado ao perfil.":"Super Admin: pode gerir múltiplas instituições.")+'</p><div class="'+(school()?"ok":"warn")+'">'+(school()?"Instituição configurada.":"Nenhuma instituição associada a este perfil.")+'</div></div>');return}
if(view==="nova"){shell('<div class="hero"><h1>NOVA AI</h1><p>Assistente escolar por tenant, com identidade do utilizador e autenticação JWT.</p></div><div class="card"><p>Utilizador: <b>'+esc(me.nome_completo)+'</b></p><p class="muted">A IA deve respeitar a instituição do perfil e nunca misturar dados entre escolas.</p></div>');return}
const map={alunos:["Alunos","alunos"],professores:["Professores","professores"],academico:["Estrutura Académica","turmas"],comunicacao:["Comunicação","comunicados"],encarregados:["Encarregados de Educação","encarregados"],admissoes:["Admissões","candidatos_admissao"],financeiro:["Financeiro","cobrancas_escolares"],documentos:["Documentos","documentos_escolares"]};const z=map[view];if(z)return list(z[0],z[1]);}
db.auth.onAuthStateChange(e=>{if(e==="SIGNED_OUT"){me=null;login()}});(async()=>{const{data:{session}}=await db.auth.getSession();session?load():login()})();
</script>
</body></html>
