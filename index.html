async function enrollCourse(courseId){
  if(!me){open("loginModal");return}

  if(fe||!forming){alert("O perfil de formando ainda não está disponível. Saia e entre novamente.");return}
  const {data:existing,error:ee}=await db.from("formacao_inscricoes").select("id,estado,progresso").eq("formando_id",forming.id).eq("curso_id",courseId).maybeSingle();
  if(ee){alert(ee.message);return}
  if(existing){view="lms";await render();return}
  const {error}=await db.from("formacao_inscricoes").insert({
    instituicao_id:null,
    formando_id:forming.id,
    curso_id:courseId,
    turma_id:null,
    estado:"PENDENTE",
    data_inscricao:new Date().toISOString().slice(0,10),
    progresso:0,
    nota_final:null,
    certificado_id:null,
    cobranca_id:null
  });
  if(error){alert("Não foi possível concluir a matrícula: "+error.message);return}
  view="lms";await render();
}

async function studyCourse(courseId){

  const {data:lms}=await db.from("lms_cursos").select("id,nome,descricao,formacao_curso_id").eq("formacao_curso_id",courseId).maybeSingle();

  lmsStudy.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2>'+esc(lms.nome)+'</h2><p class="muted">'+esc(lms.descricao||"")+'</p></div><span class="pill">'+pct+'% concluído</span></div><div style="height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:14px 0"><div style="height:100%;width:'+pct+'%;background:#16a36b"></div></div><div>'+((contents||[]).map(c=>{const p=done.get(c.id),isDone=!!p?.concluido;return '<article class="card" style="margin-top:12px;background:#f8fafc"><div style="display:flex;justify-content:space-between;gap:12px"><div><h3 style="margin:0 0 6px">'+esc(c.ordem)+'. '+esc(c.titulo)+'</h3><p class="muted">'+esc(c.descricao||"")+'</p><details><summary>Ver conteúdo</summary><div style="white-space:pre-wrap;margin-top:10px;line-height:1.6">'+esc(c.texto_conteudo||"")+'</div></details></div><button class="'+(isDone?"secondary":"public-btn primary")+'" data-complete="'+esc(c.id)+'" '+(isDone?"disabled":"")+'>'+(isDone?"✓ Concluído":"Marcar como concluído")+'</button></div></article>'}).join('')||'<p class="muted">Ainda não existem conteúdos publicados para este curso.</p>')+'</div>'+(pct>=100?'<div class="ok" style="margin-top:16px"><b>🎉 Curso concluído!</b><br>A matrícula foi marcada como CONCLUÍDA. A emissão do certificado segue o fluxo de certificação e a taxa aplicável de 5.000 Kz.</div>':'')+'</div>';
  document.querySelectorAll("[data-complete]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="A guardar…";const cid=b.dataset.complete;const existing=done.get(cid);let res;if(existing)res=await db.from("lms_progresso_conteudos").update({concluido:true,concluido_em:new Date().toISOString()}).eq("id",existing.id);else res=await db.from("lms_progresso_conteudos").insert({inscricao_id:ins.id,conteudo_id:cid,concluido:true,concluido_em:new Date().toISOString()});if(res.error){b.disabled=false;b.textContent="Tentar novamente";alert(res.error.message);return}await studyCourse(courseId);});
}

  db.from("perfis").select("id,nome_completo,email,role").eq("instituicao_id",inst).eq("ativo",true).order("nome_completo").limit(200)
 ]);
 const employees=er.data||[],profiles=pr.data||[];
 shell('<div class="hero"><h1>👥 Recursos Humanos</h1><p>Colaboradores, contratos, férias e pré-cálculo salarial. Os registos ficam limitados à instituição autenticada.</p></div>'+
 '<div class="grid"><div class="card stat"><strong>'+employees.length+'</strong><span>Colaboradores registados</span></div><div class="card stat"><strong>'+employees.filter(e=>e.estado==="ativo").length+'</strong><span>Ativos</span></div><div class="card stat"><strong>'+employees.filter(e=>e.tipo_contrato==="efetivo").length+'</strong><span>Contratos efetivos</span></div><div class="card stat"><strong>PREVIEW</strong><span>Folha salarial</span></div></div>'+
 (er.error?'<div class="error">Erro ao carregar RH: '+esc(er.error.message)+'</div>':'')+(pr.error?'<div class="error">Erro ao carregar perfis: '+esc(pr.error.message)+'</div>':'')+
 '<div class="card"><h2>Registar colaborador</h2><p class="muted">O perfil de acesso deve existir previamente. Este formulário associa o perfil à ficha de RH; não cria credenciais de autenticação.</p><form id="rhForm" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+
 '<div><label>Perfil existente</label><select id="rhProfile" required><option value="">Selecionar colaborador</option>'+profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.nome_completo||p.email)+' · '+esc(p.role)+'</option>').join("")+'</select></div>'+
 '<div><label>Nº funcionário</label><input id="rhNumber" maxlength="40"></div><div><label>Cargo</label><input id="rhCargo" required></div><div><label>Departamento</label><input id="rhDept"></div><div><label>Data de admissão</label><input id="rhAdmission" type="date"></div><div><label>Tipo de contrato</label><select id="rhContract"><option value="efetivo">Efetivo</option><option value="termo">A termo</option><option value="tempo_parcial">Tempo parcial</option><option value="prestacao_servicos">Prestação de serviços</option><option value="estagio">Estágio</option></select></div><div><label>Salário base (AOA)</label><input id="rhSalary" type="number" min="0" step="0.01"></div><div style="grid-column:1/-1"><button class="primary" style="max-width:250px">Guardar ficha de RH</button></div></form><div id="rhMsg"></div></div>'+
 '<div class="card"><h2>Colaboradores</h2><div style="overflow:auto"><table class="table"><tr><th>Nome / Perfil</th><th>Nº</th><th>Cargo</th><th>Departamento</th><th>Admissão</th><th>Contrato</th><th>Salário base</th><th>Estado</th></tr>'+employees.map(e=>{const p=profiles.find(x=>x.id===e.perfil_id);return '<tr><td>'+esc(p?.nome_completo||p?.email||"Perfil não associado")+'</td><td>'+esc(e.numero_funcionario||"—")+'</td><td>'+esc(e.cargo||"—")+'</td><td>'+esc(e.departamento||"—")+'</td><td>'+esc(e.data_admissao||"—")+'</td><td>'+esc(e.tipo_contrato||"—")+'</td><td>'+Number(e.salario_base||0).toFixed(2)+'</td><td>'+esc(e.estado)+'</td></tr>'}).join("")+'</table></div></div>'+
 '<div class="card"><h2>Motor salarial — cálculo de simulação</h2><p class="warn">A base de dados ainda não tem tabelas de folha salarial nem tabela versionada de regras IRT/INSS. Não serão inventadas taxas nem emitidos recibos. Insira regras verificadas pela fonte oficial para simular.</p><form id="payrollForm" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Salário base (AOA)</label><input id="payBase" type="number" min="0" step="0.01" required></div><div><label>Subsídios (AOA)</label><input id="payAllow" type="number" min="0" step="0.01" value="0"></div><div><label>Prémios (AOA)</label><input id="payBonus" type="number" min="0" step="0.01" value="0"></div><div><label>Outros descontos (AOA)</label><input id="payOther" type="number" min="0" step="0.01" value="0"></div><div style="grid-column:1/-1"><label>Regras IRT/INSS verificadas (JSON)</label><textarea id="payRules" rows="6" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px" placeholder=\'{"source":"referência oficial validada","effectiveFrom":"AAAA-MM-DD","inssEmployeeRate":0,"inssEmployerRate":0,"irtBaseMode":"gross","irtBrackets":[{"upTo":null,"rate":0,"deduction":0}]}\'></textarea><button class="primary" style="max-width:250px">Calcular simulação</button></div></form><div id="payResult"></div></div>');
 rhForm.onsubmit=async e=>{e.preventDefault();const existing=employees.find(x=>x.perfil_id===rhProfile.value);if(existing){rhMsg.innerHTML='<div class="error">Este perfil já tem uma ficha de RH.</div>';return}const payload={instituicao_id:inst,perfil_id:rhProfile.value,numero_funcionario:rhNumber.value.trim()||null,cargo:rhCargo.value.trim(),departamento:rhDept.value.trim()||null,data_admissao:rhAdmission.value||null,tipo_contrato:rhContract.value, salario_base:rhSalary.value===""?null:Number(rhSalary.value),estado:"ativo"};rhMsg.innerHTML='<div class="warn">A guardar…</div>';const {error}=await db.from("rh_funcionarios").insert(payload);if(error){rhMsg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}rhMsg.innerHTML='<div class="ok">Ficha de RH criada.</div>';await rhView()};
 payrollForm.onsubmit=e=>{e.preventDefault();try{const rules=JSON.parse(payRules.value);const result=window.NOVAToddleEngines.calculatePayroll({base:Number(payBase.value),allowances:Number(payAllow.value||0),bonuses:Number(payBonus.value||0),otherDeductions:Number(payOther.value||0)},rules);payResult.innerHTML='<div class="ok"><b>Simulação (não é recibo oficial)</b><p>Bruto: '+result.gross.toFixed(2)+' AOA</p><p>INSS trabalhador: '+result.inssEmployee.toFixed(2)+' AOA</p><p>IRT: '+result.irt.toFixed(2)+' AOA</p><p>Descontos adicionais: '+result.otherDeductions.toFixed(2)+' AOA</p><p><b>Líquido: '+result.net.toFixed(2)+' AOA</b></p><p>INSS entidade empregadora: '+result.inssEmployer.toFixed(2)+' AOA · Custo estimado: '+result.employerCost.toFixed(2)+' AOA</p><small>Fonte declarada: '+esc(result.rulesSource)+' · Vigência: '+esc(result.rulesEffectiveFrom)+'</small></div>'}catch(err){payResult.innerHTML='<div class="error">'+esc(err.message)+'</div>'}};
}
async function purchasesView(){
 if(!school()){shell('<div class="warn">Associe este perfil a uma escola para utilizar Compras.</div>');return}
 const inst=me.instituicao_id;
 const [fr,pr]=await Promise.all([
  db.from("compras_fornecedores").select("id,nome,nif,email,telefone,categoria,ativo").eq("instituicao_id",inst).order("nome").limit(200),
  db.from("compras_pedidos").select("id,numero,fornecedor_id,data_pedido,estado,total,observacoes").eq("instituicao_id",inst).order("data_pedido",{ascending:false}).limit(100)
 ]);
 const suppliers=fr.data||[],orders=pr.data||[];
 shell('<div class="hero"><h1>🛒 Aprovisionamento e Compras</h1><p>Fornecedores, pedidos de compra e controlo de valores por instituição.</p></div><div class="grid"><div class="card stat"><strong>'+suppliers.length+'</strong><span>Fornecedores</span></div><div class="card stat"><strong>'+suppliers.filter(s=>s.ativo).length+'</strong><span>Ativos</span></div><div class="card stat"><strong>'+orders.length+'</strong><span>Pedidos</span></div><div class="card stat"><strong>'+orders.filter(o=>o.estado==="pendente"||o.estado==="rascunho").length+'</strong><span>Em aberto</span></div></div>'+
 (fr.error?'<div class="error">Erro de fornecedores: '+esc(fr.error.message)+'</div>':'')+(pr.error?'<div class="error">Erro de pedidos: '+esc(pr.error.message)+'</div>':'')+
 '<div class="card"><h2>Cadastrar fornecedor</h2><form id="supplierForm" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Nome / razão social</label><input id="supName" required></div><div><label>NIF</label><input id="supNif" maxlength="30"></div><div><label>Email</label><input id="supEmail" type="email"></div><div><label>Telefone</label><input id="supPhone"></div><div><label>Categoria</label><input id="supCategory"></div><div style="grid-column:1/-1"><button class="primary" style="max-width:250px">Guardar fornecedor</button></div></form><div id="supMsg"></div></div>'+
 '<div class="card"><h2>Novo pedido de compra</h2><p class="warn">O esquema atual não contém uma tabela de linhas de pedido/receção de mercadorias. Esta versão regista o cabeçalho e o total; o fluxo completo por artigos, receção e contabilização exige migração e testes antes de ser ativado.</p><form id="purchaseForm" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Fornecedor</label><select id="poSupplier" required><option value="">Selecionar</option>'+suppliers.filter(s=>s.ativo).map(s=>'<option value="'+esc(s.id)+'">'+esc(s.nome)+' · '+esc(s.nif||"sem NIF")+'</option>').join("")+'</select></div><div><label>Número interno do pedido</label><input id="poNumber" maxlength="50"></div><div><label>Data do pedido</label><input id="poDate" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div><div><label>Total estimado (AOA)</label><input id="poTotal" type="number" min="0.01" step="0.01" required></div><div style="grid-column:1/-1"><label>Justificação / observações</label><input id="poNotes" maxlength="500"></div><div style="grid-column:1/-1"><button class="primary" style="max-width:250px">Criar pedido de compra</button></div></form><div id="poMsg"></div></div>'+
 '<div class="card"><h2>Pedidos recentes</h2><div style="overflow:auto"><table class="table"><tr><th>Número</th><th>Data</th><th>Fornecedor</th><th>Total</th><th>Estado</th><th>Observações</th></tr>'+orders.map(o=>{const s=suppliers.find(x=>x.id===o.fornecedor_id);return '<tr><td>'+esc(o.numero||"—")+'</td><td>'+esc(o.data_pedido)+'</td><td>'+esc(s?.nome||"Fornecedor não encontrado")+'</td><td>'+Number(o.total||0).toFixed(2)+'</td><td>'+esc(o.estado)+'</td><td>'+esc(o.observacoes||"—")+'</td></tr>'}).join("")+'</table></div></div>'+
 '<div class="card"><h2>Fornecedores</h2><div style="overflow:auto"><table class="table"><tr><th>Nome</th><th>NIF</th><th>Email</th><th>Telefone</th><th>Categoria</th><th>Ativo</th></tr>'+suppliers.map(s=>'<tr><td>'+esc(s.nome)+'</td><td>'+esc(s.nif||"—")+'</td><td>'+esc(s.email||"—")+'</td><td>'+esc(s.telefone||"—")+'</td><td>'+esc(s.categoria||"—")+'</td><td>'+esc(s.ativo)+'</td></tr>').join("")+'</table></div></div>');
 supplierForm.onsubmit=async e=>{e.preventDefault();supMsg.innerHTML='<div class="warn">A guardar…</div>';const {error}=await db.from("compras_fornecedores").insert({instituicao_id:inst,nome:supName.value.trim(),nif:supNif.value.trim()||null,email:supEmail.value.trim()||null,telefone:supPhone.value.trim()||null,categoria:supCategory.value.trim()||null,ativo:true});if(error){supMsg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}await purchasesView()};
 purchaseForm.onsubmit=async e=>{e.preventDefault();const total=Number(poTotal.value);if(!Number.isFinite(total)||total<=0){poMsg.innerHTML='<div class="error">O total deve ser superior a zero.</div>';return}poMsg.innerHTML='<div class="warn">A guardar pedido…</div>';const {error}=await db.from("compras_pedidos").insert({instituicao_id:inst,fornecedor_id:poSupplier.value,numero:poNumber.value.trim()||null,data_pedido:poDate.value,estado:"rascunho",total,observacoes:poNotes.value.trim()||null,criado_por:me.id});if(error){poMsg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}await purchasesView()};
}

 }

 const {data:inst}=await db.from("instituicao").select("codigo_escola,nome,status,plano,data_expiracao,logo_url,limite_alunos,limite_professores").eq("id",me.instituicao_id).maybeSingle();
 const {data:sub}=await db.from("plataforma_assinaturas").select("estado,inicio,fim,limite_alunos,limite_professores,plano_id").eq("instituicao_id",me.instituicao_id).in("estado",["trial","active","past_due","suspended","expired"]).order("created_at",{ascending:false}).limit(1).maybeSingle();
 shell('<div class="hero"><h1>Bom dia, '+esc(name())+'!</h1><p>Painel operacional da escola.</p></div><div class="grid"><div class="card stat"><strong>'+c1+'</strong><span>Alunos</span></div><div class="card stat"><strong>'+c2+'</strong><span>Professores</span></div><div class="card stat"><strong>'+c3+'</strong><span>Turmas</span></div><div class="card stat"><strong>'+c4+'</strong><span>Matrículas</span></div></div><div class="grid"><div class="card"><h3>🏫 Escola</h3><p><b>'+esc(inst?.nome||"—")+'</b></p><p class="muted">Código: '+esc(inst?.codigo_escola||"—")+'</p><span class="pill">'+esc(inst?.status||"—")+'</span></div><div class="card"><h3>💳 Plano</h3><p><b>'+esc(inst?.plano||"—")+'</b></p><p class="muted">Expiração: '+esc(inst?.data_expiracao||"Sem data")+'</p><span class="pill">'+esc(sub?.estado||"sem assinatura")+'</span></div><div class="card"><h3>👨‍🎓 Limite de alunos</h3><p><b>'+esc(inst?.limite_alunos??"Não definido")+'</b></p><p class="muted">Utilizados: '+c1+'</p></div><div class="card"><h3>👩‍🏫 Limite de professores</h3><p><b>'+esc(inst?.limite_professores??"Não definido")+'</b></p><p class="muted">Utilizados: '+c2+'</p></div></div><div class="card"><h2>Ambiente da escola</h2><p class="muted">Os dados deste tenant são separados dos demais clientes através das políticas RLS da plataforma.</p></div>');return;}
if(view==="lms"){await lmsDashboard();return}
if(view==="financeiro"){await financeView();return}
if(view==="contabilidade"){await accountingView();return}
if(view==="rh"){await rhView();return}
if(view==="compras"){await purchasesView();return}

if(view==="nova-escola"&&admin()){await createSchool();return}
if(view==="escolas"&&admin()){await schools();return}
if(view==="planos"&&admin()){await list("Planos Comerciais","plataforma_planos");return}

if(view==="suporte"){await list("Suporte","plataforma_suporte");return}
if(view==="assinaturas"&&admin()){await assinaturas();return}
if(view==="instituicao"){shell('<div class="card"><h1>Instituição</h1><p class="muted">'+(school()?"Tenant associado ao perfil.":"Super Admin: pode gerir múltiplas instituições.")+'</p><div class="'+(school()?"ok":"warn")+'">'+(school()?"Instituição configurada.":"Nenhuma instituição associada a este perfil.")+'</div></div>');return}
if(view==="nova"){shell('<div class="hero"><h1>NOVA AI</h1><p>Assistente escolar por tenant, com identidade do utilizador e autenticação JWT.</p></div><div class="card"><p>Utilizador: <b>'+esc(me.nome_completo)+'</b></p><p class="muted">A IA deve respeitar a instituição do perfil e nunca misturar dados entre escolas.</p></div>');return}
const map={alunos:["Alunos","alunos"],professores:["Professores","professores"],academico:["Estrutura Académica","turmas"],comunicacao:["Comunicação","comunicados"],encarregados:["Encarregados de Educação","encarregados"],admissoes:["Admissões","candidatos_admissao"],financeiro:["Financeiro","cobrancas_escolares"],documentos:["Documentos","documentos_escolares"]};const z=map[view];if(z)return list(z[0],z[1]);}
