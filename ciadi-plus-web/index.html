<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><title>CIADI+</title><style>
:root{--b:#0f766e;--b2:#14b8a6;--bg:#f4f8f8;--ink:#173042;--mut:#71818b;--line:#e2ebed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;display:grid;place-items:center;font-weight:900}.top small{display:block;color:var(--mut)}main{padding:16px 16px 88px}.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px;box-shadow:0 7px 25px #163f5010}.card h3{margin:0 0 6px}.mut{color:var(--mut);font-size:13px}.stat{font-size:27px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0}.row strong{display:block}.videoBtn{margin-top:8px;padding:8px 10px;font-size:12px}.pill{font-size:11px;background:#e6f6f3;color:var(--b);padding:5px 8px;border-radius:999px}.btn{border:0;background:var(--b);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700}.secondary{background:#e7f5f3;color:var(--b)}.danger{background:#dc2626}.block{width:100%}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}.field textarea{min-height:100px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{border:0;background:#fff;color:#71818b;padding:8px 2px;font-size:10px}.nav .on{color:var(--b);font-weight:800;background:#eef9f7}.nav i{display:block;font-size:19px;font-style:normal}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:25px;padding:25px;border:1px solid var(--line);box-shadow:0 15px 50px #123b4a18}.loginlogo{margin:auto;width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;font-size:24px;font-weight:900}.error{background:#fff0f0;color:#a11;padding:10px;border-radius:10px;font-size:13px}.empty{text-align:center;color:var(--mut);padding:25px}
</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://egpkkttbcaukqnnxyhjv.supabase.co",KEY="sb_publishable_SSA6B6gfnaUxKhOzReE6HQ_utqQRebz",db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let S={session:null,p:null,tab:"home"};const $=x=>document.querySelector(x),e=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const date=x=>x?new Date(x).toLocaleString("pt-AO",{dateStyle:"medium",timeStyle:"short"}):"—");
function login(){root.innerHTML='<div class="login"><div class="loginbox"><div class="loginlogo">C+</div><h1 style="text-align:center">CIADI+</h1><p class="mut" style="text-align:center">Mobile Web conectado ao Supabase</p><div id="err"></div><form id="f"><div class="field"><label>Email</label><input id="em" type="email" required></div><div class="field"><label>Palavra-passe</label><input id="pw" type="password" required></div><button class="btn block">Entrar</button></form></div></div>';f.onsubmit=async x=>{x.preventDefault();const r=await db.auth.signInWithPassword({email:em.value,password:pw.value});if(r.error)err.innerHTML='<div class="error">'+e(r.error.message)+'</div>'}}
async function profile(){let r=await db.from("perfis").select("*").eq("id",S.session.user.id).maybeSingle();S.p=r.data||{nome_exibicao:S.session.user.email,tipo:"utilizador"}}
function nav(id,ico,t){return '<button class="'+(S.tab==id?"on":"")+'" onclick="go(\''+id+'\')"><i>'+ico+'</i>'+t+'</button>'}
function shell(){root.innerHTML='<div class="app"><header class="top"><div class="brand"><div class="logo">C+</div><div><b>CIADI+</b><small>'+e(S.p.nome_exibicao||S.p.nome_completo||"Utilizador")+' · '+e(S.p.tipo)+'</small></div><button class="btn secondary" style="margin-left:auto;padding:8px" onclick="db.auth.signOut()">Sair</button></div></header><main id="main"></main><nav class="nav">'+nav("home","⌂","Início")+nav("agenda","◷","Agenda")+nav("patients","♡","Assistidos")+nav("chat","◌","Chat")+nav("profile","◎","Perfil")+'</nav></div>';render()}
async function go(t){S.tab=t;render()}
async function render(){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.textContent.includes(S.tab)));let c=$("#main");c.innerHTML='<div class="empty">A carregar…</div>';if(S.tab=="home")return home(c);if(S.tab=="agenda")return agenda(c);if(S.tab=="patients")return patients(c);if(S.tab=="chat")return chat(c);return profileView(c)}
async function home(c){let [a,n]=await Promise.all([db.from("agendamentos").select("id,data_hora,estado,modalidade,especialidade:especialidades(nome),paciente:pacientes(nome_completo)").order("data_hora").limit(5),db.from("notificacoes").select("id,lida").eq("perfil_id",S.session.user.id)]);let up=(a.data||[]).filter(x=>new Date(x.data_hora)>=new Date());c.innerHTML='<div class="hero"><h1>Olá, '+e(S.p.nome_exibicao||"bem-vindo")+' 👋</h1><p>O seu CIADI+ móvel está ligado ao seu perfil e aos dados autorizados no Supabase.</p><div style="margin-top:14px"><button class="btn secondary" onclick="triage()">+ Solicitar triagem</button></div></div><div class="grid"><div class="card"><span class="mut">Próximas consultas</span><div class="stat">'+up.length+'</div></div><div class="card"><span class="mut">Notificações</span><div class="stat">'+((n.data||[]).filter(x=>!x.lida).length)+'</div></div></div><h2>Próximos atendimentos</h2>'+(up.length?up.map(x=>'<div class="row"><div><strong>'+e(x.especialidade?.nome||"Atendimento")+'</strong><span class="mut">'+date(x.data_hora)+' · '+e(x.paciente?.nome_completo||"")+'</span></div><span class="pill">'+e(x.estado||"")+'</span></div>').join(""):'<div class="card empty">Sem atendimentos futuros.</div>')}
async function triage(){main.innerHTML='<h2>Solicitar triagem virtual</h2><div class="card"><div class="field"><label>Especialidade</label><select id="esp"><option value="">Selecione…</option></select></div><div class="field"><label>Motivo principal</label><input id="mot" maxlength="300" placeholder="Descreva brevemente o motivo"></div><div class="field"><label>Queixa principal</label><textarea id="queixa" maxlength="2000" placeholder="O que pretende avaliar ou acompanhar?"></textarea></div><button class="btn block" onclick="sendTriage()">Enviar solicitação</button></div>';let r=await db.from("especialidades").select("id,nome").eq("ativo",true).order("ordem");(r.data||[]).forEach(x=>{let o=document.createElement("option");o.value=x.id;o.textContent=x.nome;document.getElementById("esp").appendChild(o)})}
async function sendTriage(){let r=await db.from("ciadi_triagens").insert({solicitante_perfil_id:S.session.user.id,especialidade_id:document.getElementById("esp").value||null,motivo_principal:document.getElementById("mot").value.trim(),queixa_principal:document.getElementById("queixa").value.trim(),origem:"mobile_web",modalidade:"online",estado:"solicitada"});alert(r.error?r.error.message:"Triagem solicitada com sucesso");render()}
function clinicUrl(id){return "./sala.html?agendamento_id="+encodeURIComponent(id)}\nfunction openClinic(id){window.location.href=clinicUrl(id)}\nfunction openClinicFromQuery(){const id=new URLSearchParams(location.search).get("agendamento_id");if(id){window.location.replace(clinicUrl(id));return true}return false}
async function agenda(c){let r=await db.from("agendamentos").select("id,data_hora,estado,tipo,modalidade,especialidade:especialidades(nome),paciente:pacientes(nome_completo)").order("data_hora",{ascending:false}).limit(30);c.innerHTML='<h2>Agenda</h2>'+(r.error?'<div class="error">'+e(r.error.message)+'</div>':((r.data||[]).length?r.data.map(x=>{const online=["online","video","virtual"].includes(String(x.modalidade||x.tipo||"").toLowerCase());const active=!["cancelada","cancelado","concluida","concluído","concluída","faltou"].includes(String(x.estado||"").toLowerCase());return '<div class="row"><div><strong>'+e(x.especialidade?.nome||"Atendimento")+'</strong><span class="mut">'+date(x.data_hora)+' · '+e(x.paciente?.nome_completo||"")+'</span>'+(online?'<br><button class="btn videoBtn" onclick="openClinic(\\''+x.id+'\\')" '+(!active?"disabled":"")+' >🎥 Clínica Virtual</button>':"")+'</div><span class="pill">'+e(x.estado||"")+'</span></div>'}).join(""):'<div class="card empty">Nenhum agendamento visível.</div>'))}
async function patients(c){let r;if((S.p.tipo||"")=="paciente"){r=await db.from("pacientes").select("id,nome_completo,data_nascimento,sexo").eq("perfil_id",S.session.user.id);c.innerHTML='<h2>Meu acompanhamento</h2>'+(r.data||[]).map(x=>'<div class="card"><h3>'+e(x.nome_completo)+'</h3><span class="mut">Nascimento: '+e(x.data_nascimento||"—")+'</span><br><button class="btn secondary" style="margin-top:10px" onclick="follow(\''+x.id+'\')">Ver acompanhamento</button></div>').join("")||'<div class="card empty">Ficha não encontrada.</div>';return}r=await db.from("ciadi_vinculos_familiares").select("paciente:pacientes(id,nome_completo,data_nascimento)").eq("perfil_id",S.session.user.id).eq("ativo",true);c.innerHTML='<h2>Assistidos</h2>'+((r.data||[]).length?r.data.map(x=>'<div class="card"><h3>👧 '+e(x.paciente?.nome_completo)+'</h3><span class="mut">Nascimento: '+e(x.paciente?.data_nascimento||"—")+'</span><br><button class="btn secondary" style="margin-top:10px" onclick="follow(\''+x.paciente?.id+'\')">Acompanhamento</button></div>').join(""):'<div class="card empty">Nenhum assistido autorizado.</div>')}
async function follow(id){let r=await db.from("ciadi_acompanhamentos_diarios_aba").select("data_registo,tipo_sessao,progresso_observado,resultado_sessao,recomendacoes_familia").eq("paciente_id",id).eq("publicado_familia",true).order("data_registo",{ascending:false}).limit(15);main.innerHTML='<h2>Acompanhamento</h2><button class="btn secondary" onclick="render()">Voltar</button>'+(r.data?.length?r.data.map(x=>'<div class="card"><span class="mut">'+e(x.data_registo)+' · '+e(x.tipo_sessao||"Sessão")+'</span><h3>'+e(x.progresso_observado||x.resultado_sessao||"Registo")+'</h3><p>'+e(x.recomendacoes_familia||"")+'</p></div>').join(""):'<div class="card empty">Sem registos publicados.</div>')}
async function chat(c){let r=await db.from("mensagens").select("assunto,mensagem,lida,created_at").or("remetente_id.eq."+S.session.user.id+",destinatario_id.eq."+S.session.user.id).order("created_at",{ascending:false}).limit(30);c.innerHTML='<h2>Chat</h2><div class="card"><p class="mut">Mensagens protegidas pelas políticas RLS do Supabase.</p><button class="btn" onclick="newMsg()">Nova mensagem</button></div>'+(r.data?.length?r.data.map(x=>'<div class="row"><div><strong>'+e(x.assunto||"Mensagem")+'</strong><span class="mut">'+e(x.mensagem)+' · '+date(x.created_at)+'</span></div><span class="pill">'+(x.lida?"lida":"nova")+'</span></div>').join(""):'<div class="card empty">Sem mensagens.</div>')}
function newMsg(){main.innerHTML='<h2>Nova mensagem</h2><div class="card"><div class="field"><label>ID do destinatário</label><input id="to"></div><div class="field"><label>Assunto</label><input id="sub"></div><div class="field"><label>Mensagem</label><textarea id="body"></textarea></div><button class="btn block" onclick="sendMsg()">Enviar</button></div>'}
async function sendMsg(){let r=await db.from("mensagens").insert({remetente_id:S.session.user.id,destinatario_id:to.value.trim(),assunto:sub.value.trim(),mensagem:body.value.trim()});alert(r.error?r.error.message:"Mensagem enviada");render()}
async function profileView(c){c.innerHTML='<h2>Meu perfil</h2><div class="card"><div class="field"><label>Nome de exibição</label><input id="nm" value="'+e(S.p.nome_exibicao||"")+'"></div><div class="field"><label>Telefone</label><input id="tel" value="'+e(S.p.telefone||"")+'"></div><button class="btn block" onclick="save()">Guardar</button></div>'}
async function save(){let r=await db.from("perfis").update({nome_exibicao:nm.value.trim(),telefone:tel.value.trim(),updated_at:new Date().toISOString()}).eq("id",S.session.user.id);alert(r.error?r.error.message:"Perfil atualizado");await profile();render()}
async function boot(){let r=await db.auth.getSession();S.session=r.data.session;if(!S.session)return login();await profile();if(openClinicFromQuery())return;shell()}db.auth.onAuthStateChange((_e,s)=>{S.session=s;if(!s)login()});boot();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
