<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIADI+ — Sala Clínica</title>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#fbfdff;color:#6f351f}
.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:20px;box-shadow:0 10px 35px #6f351f14}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand img{width:48px;height:48px}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#f58200;color:#fff}.muted{color:#64748b}.status{padding:8px 12px;border-radius:999px;background:#fff3e6}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.video{min-height:520px;background:#111827;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}.side{display:grid;gap:12px;align-content:start}.msg{padding:12px;border-radius:14px;background:#fff7ed}.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:14px;white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.video{min-height:420px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.2/dist/livekit-client.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
 <div class="card">
  <div class="top">
   <div class="brand"><img src="../ciadi_icon.svg" onerror="this.style.display='none'"><div><b>CIADI+</b><div class="muted">Sala Clínica Virtual</div></div></div>
   <span id="state" class="status">A preparar…</span>
  </div>
  <div id="error" class="error" style="display:none;margin-top:16px"></div>
  <div class="grid">
   <div id="video" class="video"><div id="videoMsg">A autenticar e preparar a consulta…</div></div>
   <div class="side">
    <div class="card"><b id="specialty">Consulta CIADI</b><p id="professional" class="muted">A carregar profissional…</p><p id="date" class="muted">A carregar horário…</p><button id="joinBtn" class="btn primary" onclick="joinRoom()" disabled>Entrar na consulta</button></div>
    <div class="card"><b>Controlo</b><div style="margin-top:12px;display:grid;gap:8px"><button class="btn" onclick="toggleMic()">🎙 Microfone</button><button class="btn" onclick="toggleCam()">📷 Câmara</button><button class="btn" id="leaveBtn" onclick="leaveRoom()" disabled>Sair da sala</button></div></div>
    <div class="msg"><b>Privacidade</b><div class="muted" style="margin-top:5px">Acesso limitado ao agendamento e ao perfil autorizado.</div></div>
   </div>
  </div>
 </div>
</div>
<script>
const SUPABASE_URL='https://egpkkttbcaukqnnxyhjv.supabase.co';
const SUPABASE_KEY='sb_publishable_SSA6B6gfnaUxKhOzReE6HQ_utqQRebz';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ciadi-plus-auth'}});
let room=null;
const id=new URLSearchParams(location.search).get('agendamento_id')||new URLSearchParams(location.search).get('agendamento');
const $=x=>document.getElementById(x);
function showError(e){$('error').style.display='block';$('error').textContent=e?.message||String(e);$('state').textContent='Erro';$('videoMsg').textContent='Não foi possível preparar a sala.'}
async function prepare(){
 try{
  if(!id)throw new Error('Agendamento não informado.');
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.access_token)throw new Error('Sessão CIADI+ não encontrada. Faça login novamente.');
  const a=await sb.from('agendamentos').select('id,data_hora,duracao_minutos,tipo,estado,profissionais(nome_completo),especialidades(nome)').eq('id',id).single();
  if(a.error)throw a.error;
  $('specialty').textContent=a.data.especialidades?.nome||'Consulta CIADI';
  $('professional').textContent=a.data.profissionais?.nome_completo||'Profissional CIADI';
  $('date').textContent=a.data.data_hora?new Date(a.data.data_hora).toLocaleString('pt-AO'):''; 
  const r=await fetch(SUPABASE_URL+'/functions/v1/ciadi-video-token',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify({agendamento_id:id})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.success)throw new Error(j.error||'Não foi possível autorizar a sala.');
  window.__ciadiRoom=j;
  $('state').textContent='Pronta';
  $('joinBtn').disabled=false;
 }catch(e){showError(e)}
}
async function joinRoom(){
 try{
  const j=window.__ciadiRoom;if(!j)throw new Error('Sala ainda não preparada.');
  room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});
  room.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>{const el=track.attach();el.style.maxWidth='100%';el.style.maxHeight='100%';$('video').appendChild(el)});
  room.on(LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>track.detach().forEach(el=>el.remove()));
  room.on(LivekitClient.RoomEvent.Disconnected,()=>{$('state').textContent='Desconectada';$('leaveBtn').disabled=true});
  await room.connect(j.livekit_url,j.token);
  await room.localParticipant.setMicrophoneEnabled(true);
  await room.localParticipant.setCameraEnabled(true);
  $('state').textContent='Em consulta';$('joinBtn').disabled=true;$('leaveBtn').disabled=false;$('videoMsg').remove();
 }catch(e){showError(e)}
}
async function toggleMic(){if(room)await room.localParticipant.setMicrophoneEnabled(!room.localParticipant.isMicrophoneEnabled)}
async function toggleCam(){if(room)await room.localParticipant.setCameraEnabled(!room.localParticipant.isCameraEnabled)}
async function leaveRoom(){if(room)await room.disconnect();location.reload()}
prepare();
</script>
</body></html>
