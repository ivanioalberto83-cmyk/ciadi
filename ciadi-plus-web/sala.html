<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIADI+ — Sala Clínica</title>
<style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#fbfdff;color:#6f351f}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:20px;box-shadow:0 10px 35px #6f351f14}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand img{width:48px;height:48px}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#f58200;color:#fff}.muted{color:#64748b}.status{padding:8px 12px;border-radius:999px;background:#fff3e6}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.video{min-height:520px;background:#111827;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;position:relative}.side{display:grid;gap:12px;align-content:start}.msg{padding:12px;border-radius:14px;background:#fff7ed}.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:14px;white-space:pre-wrap}.notice{color:#92400e;background:#fffbeb;padding:12px;border-radius:14px;display:none;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.video{min-height:420px}}</style>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.2/dist/livekit-client.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="wrap"><div class="card">
<div class="top"><div class="brand"><img src="../ciadi_icon.svg" onerror="this.style.display='none'"><div><b>CIADI+</b><div class="muted">Sala Clínica Virtual</div></div></div><span id="state" class="status">A preparar…</span></div>
<div id="error" class="error" style="display:none;margin-top:16px"></div><div id="notice" class="notice"></div>
<div class="grid"><div id="video" class="video"><div id="videoMsg">A autenticar e preparar a consulta…</div></div>
<div class="side"><div class="card"><b id="specialty">Consulta CIADI</b><p id="professional" class="muted">A carregar profissional…</p><p id="date" class="muted">A carregar horário…</p><button id="joinBtn" class="btn primary" onclick="joinRoom()" disabled>Entrar na consulta</button></div>
<div class="card"><b>Controlo</b><div style="margin-top:12px;display:grid;gap:8px"><button class="btn" onclick="toggleMic()">🎙 Microfone</button><button class="btn" onclick="toggleCam()">📷 Câmara</button><button class="btn" id="leaveBtn" onclick="leaveRoom()" disabled>Sair da sala</button></div></div>
<div class="msg"><b>Privacidade</b><div class="muted" style="margin-top:5px">Acesso limitado ao agendamento e ao perfil autorizado.</div></div></div></div>
</div></div>
<script>
const SUPABASE_URL='https://egpkkttbcaukqnnxyhjv.supabase.co',SUPABASE_KEY='sb_publishable_SSA6B6gfnaUxKhOzReE6HQ_utqQRebz';
const APP_URL='./index.html';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'sb-egpkkttbcaukqnnxyhjv-auth'}});
let room=null,roomInfo=null,reconnectTimer=null,reconnectAttempts=0,manualLeave=false;
const MAX_RECONNECT_ATTEMPTS=5,id=new URLSearchParams(location.search).get('agendamento_id')||new URLSearchParams(location.search).get('agendamento'),$=x=>document.getElementById(x);
async function hydrateNativeSession(){
 const h=new URLSearchParams(location.hash.replace(/^#/,''));
 const access=h.get('access_token'),refresh=h.get('refresh_token');
 if(!access||!refresh)return false;
 const {error}=await sb.auth.setSession({access_token:access,refresh_token:refresh});
 history.replaceState(null,document.title,location.pathname+'?agendamento_id='+encodeURIComponent(id));
 if(error)throw error;
 return true;
}
function setState(t){$('state').textContent=t}
function showError(e){$('error').style.display='block';$('error').textContent=e?.message||String(e);setState('Erro')}
function showNotice(t){$('notice').style.display='block';$('notice').textContent=t}
function hideNotice(){$('notice').style.display='none';$('notice').textContent=''}
function backoff(n){return Math.min(30000,1000*Math.pow(2,Math.max(0,n-1)))}
async function getRoomToken(){
 const {data:{session}}=await sb.auth.getSession(); if(!session?.access_token){location.replace(APP_URL+'?agendamento_id='+encodeURIComponent(id));throw new Error('Sessão CIADI+ não encontrada. Faça login novamente.');}
 const r=await fetch(SUPABASE_URL+'/functions/v1/ciadi-video-token',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify({agendamento_id:id})});
 const j=await r.json().catch(()=>({})); if(!r.ok||!j.success)throw new Error(j.error||'Não foi possível autorizar a sala.'); return j;
}
async function prepare(){try{if(!id)throw new Error('Agendamento não informado.');const {data:{session}}=await sb.auth.getSession();if(!session?.access_token){location.replace(APP_URL+'?agendamento_id='+encodeURIComponent(id));return;}const a=await sb.from('agendamentos').select('id,data_hora,duracao_minutos,tipo,modalidade,estado,profissionais(nome_completo),especialidades(nome)').eq('id',id).single();
if(a.data){
 const modalidade=String(a.data.modalidade||a.data.tipo||'').toLowerCase();
 if(!['online','video','virtual'].includes(modalidade)) throw new Error('Este agendamento não é uma consulta online.');
 const estado=String(a.data.estado||'').toLowerCase();
 if(['cancelada','cancelado','concluida','concluído','concluída','faltou'].includes(estado)) throw new Error('Esta consulta não está disponível.');
}if(a.error)throw a.error;$('specialty').textContent=a.data.especialidades?.nome||'Consulta CIADI';$('professional').textContent=a.data.profissionais?.nome_completo||'Profissional CIADI';$('date').textContent=a.data.data_hora?new Date(a.data.data_hora).toLocaleString('pt-AO'):'';roomInfo=await getRoomToken();setState('Pronta');$('joinBtn').disabled=false}catch(e){showError(e)}}
function attachEvents(){
 room.on(LivekitClient.RoomEvent.TrackSubscribed,t=>{const el=t.attach();el.style.maxWidth='100%';el.style.maxHeight='100%';$('video').appendChild(el)});
 room.on(LivekitClient.RoomEvent.TrackUnsubscribed,t=>t.detach().forEach(el=>el.remove()));
 room.on(LivekitClient.RoomEvent.Reconnecting,()=>{setState('A reconectar…');showNotice('Ligação perdida. A tentar reconectar automaticamente…');$('joinBtn').disabled=true;$('leaveBtn').disabled=true});
 room.on(LivekitClient.RoomEvent.Reconnected,()=>{reconnectAttempts=0;hideNotice();setState('Em consulta');$('leaveBtn').disabled=false});
 room.on(LivekitClient.RoomEvent.ConnectionQualityChanged,q=>{if(q===LivekitClient.ConnectionQuality.Poor)showNotice('A qualidade da ligação está baixa. Verifique a internet.');else if(!reconnectTimer)hideNotice()});
 room.on(LivekitClient.RoomEvent.Disconnected,()=>{if(manualLeave){setState('Desconectada');return}scheduleReconnect()});
}
async function connectRoom(){if(!roomInfo)roomInfo=await getRoomToken();if(room){try{room.removeAllListeners();await room.disconnect()}catch{}}room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});attachEvents();await room.connect(roomInfo.livekit_url,roomInfo.token,{autoSubscribe:true});reconnectAttempts=0;hideNotice();await room.localParticipant.setMicrophoneEnabled(true);await room.localParticipant.setCameraEnabled(true);setState('Em consulta');$('joinBtn').disabled=true;$('leaveBtn').disabled=false;$('videoMsg').style.display='none'}
function scheduleReconnect(){if(reconnectTimer||manualLeave)return;if(reconnectAttempts>=MAX_RECONNECT_ATTEMPTS){showError(new Error('Não foi possível reconectar automaticamente. Verifique a internet e tente entrar novamente.'));$('joinBtn').disabled=false;setState('Reconexão necessária');return}const n=++reconnectAttempts,delay=backoff(n);showNotice('Reconexão '+n+'/'+MAX_RECONNECT_ATTEMPTS+' em '+Math.ceil(delay/1000)+'s…');reconnectTimer=setTimeout(async()=>{reconnectTimer=null;try{roomInfo=await getRoomToken();await connectRoom()}catch(e){if(reconnectAttempts>=MAX_RECONNECT_ATTEMPTS){showError(e);$('joinBtn').disabled=false;setState('Reconexão necessária')}else scheduleReconnect()}},delay)}
async function joinRoom(){try{manualLeave=false;reconnectAttempts=0;hideNotice();await connectRoom()}catch(e){showError(e)}}
async function toggleMic(){if(room?.state===LivekitClient.ConnectionState.Connected)await room.localParticipant.setMicrophoneEnabled(!room.localParticipant.isMicrophoneEnabled)}
async function toggleCam(){if(room?.state===LivekitClient.ConnectionState.Connected)await room.localParticipant.setCameraEnabled(!room.localParticipant.isCameraEnabled)}
async function leaveRoom(){manualLeave=true;if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}if(room)await room.disconnect();location.reload()}
hydrateNativeSession().catch(()=>false).then(()=>prepare());
</script></body></html>
